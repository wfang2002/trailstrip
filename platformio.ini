[platformio]
default_envs = trailstrip_v2
src_dir = main

[env]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DCONFIG_SENSORLIB_ESP_IDF_NEW_API=1

[env:trailstrip_v2]
build_flags = ${env.build_flags} -DTRAILSTRIP_BOARD_V2=1

[env:trailstrip_v1]
build_flags = ${env.build_flags} -DTRAILSTRIP_BOARD_V2=0
